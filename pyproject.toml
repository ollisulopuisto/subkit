[project]
name = "subkit"
version = "0.3.0"
description = "Subtitle transcription (Parakeet/Orukeet ASR) and LLM translation pipeline for Jellyfin libraries"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
asr-sherpa = ["sherpa-onnx>=1.12", "soundfile>=0.12", "numpy>=1.26"]
asr-mlx = ["parakeet-mlx>=0.3"]
dev = ["pytest>=8.0", "ruff==0.17.3"]

[project.scripts]
subkit = "subkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["subkit"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["subkit"]

[tool.ruff.lint]
extend-select = ["E", "F", "I", "B", "C4", "UP", "RUF100", "RUF022"]
ignore = ["E501", "B008", "B018"]
unfixable = ["F401"]
dummy-variable-rgx = "^(_+|unused|dummy)$"

[tool.ruff.lint.isort]
known-first-party = ["subkit"]
force-sort-within-sections = true

[tool.ruff.format]
docstring-code-format = true

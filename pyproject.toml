[project]
name = "subkit"
version = "0.3.0"
description = "Subtitle transcription (Parakeet/Orukeet ASR) and LLM translation pipeline for Jellyfin libraries"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
asr-sherpa = ["sherpa-onnx>=1.12", "soundfile>=0.12", "numpy>=1.26"]
asr-mlx = ["parakeet-mlx>=0.3"]
dev = ["pytest>=8.0"]

[project.scripts]
subkit = "subkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["subkit"]
